<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lookbook · EMK SYSTEM</title>
<meta name="description" content="Peace Collection 001 in Los Angeles. Drag through the photos.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23d4c3a3' stroke-width='2'/%3E%3C/svg%3E">
<style>html,body{background:#0a0a0a;color:#e8e0cc}</style>
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body data-page="lookbook" data-no-smooth="">
<!-- @include header -->
<main id="main">
  <section class="look" aria-labelledby="look-title" data-cursor="Drag">
    <canvas aria-hidden="true"></canvas>
    <div class="look-head"><h1 class="head" id="look-title" data-split>Lookbook</h1><p class="lead">Peace Collection 001, photographed in Los Angeles.</p><p class="muted">Drag to drift. Tap a photo.</p></div>
  </section>
  <h2 class="head look-all" style="padding:var(--gap) var(--margin) 0" data-split>Every photo</h2>
  <div class="look-fallback">
    <button type="button" data-open="0" data-reveal><img src="img/lb-back-sky.webp" alt="The back print on an LA rooftop, the skyline beyond" loading="lazy"></button>
    <button type="button" data-open="1" data-reveal><img src="img/lb-front-sky.webp" alt="The tee from the front on the rooftop" loading="lazy"></button>
    <button type="button" data-open="2" data-reveal><img src="img/lb-flatlay.webp" alt="The tee laid flat on its box" loading="lazy"></button>
    <button type="button" data-open="3" data-reveal><img src="img/lb-label.webp" alt="The woven chest label" loading="lazy"></button>
    <button type="button" data-open="4" data-reveal><img src="img/lb-back-tower.webp" alt="The back print in front of a tower" loading="lazy"></button>
    <button type="button" data-open="5" data-reveal><img src="img/lb-front-bench.webp" alt="The chest label, leaning on a bench" loading="lazy"></button>
    <button type="button" data-open="6" data-reveal><img src="img/lb-walk.webp" alt="Walking the rooftop" loading="lazy"></button>
    <button type="button" data-open="7" data-reveal><img src="img/lb-back-close.webp" alt="The back print up close" loading="lazy"></button>
    <button type="button" data-open="8" data-reveal><img src="img/lb-hem.webp" alt="The barcode print at the hem" loading="lazy"></button>
    <button type="button" data-open="9" data-reveal><img src="img/lb-back-34.webp" alt="Looking out over Los Angeles" loading="lazy"></button>
    <button type="button" data-open="10" data-reveal><img src="img/lb-box.webp" alt="The tee in its box" loading="lazy"></button>
    <button type="button" data-open="11" data-reveal><img src="img/lb-folded.webp" alt="The tee folded with its hang tag" loading="lazy"></button>
  </div>
  <div class="lightbox" data-lightbox role="dialog" aria-label="Photo" tabindex="-1" hidden>
    <button class="lightbox-close" type="button" aria-label="Close" data-close>×</button>
    <img src="img/lb-back-sky.webp" alt="">
    <div class="lightbox-bar">
      <button class="btn btn-quiet" type="button" data-prev aria-label="Previous photo">Prev</button>
      <span class="muted" data-cap></span>
      <span style="display:flex;gap:8px"><a class="btn" href="order.html#claim">Order this</a><button class="btn btn-quiet" type="button" data-next aria-label="Next photo">Next</button></span>
    </div>
  </div>
</main>
<!-- @include footer -->
<!-- @include bar -->
<script type="module" src="./src/main.js"></script>
</body>
</html>
